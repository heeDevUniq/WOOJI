server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 도커 MySQL (컨테이너명 wooji, 호스트포트 3307 - 로컬 3306은 XAMPP mysqld)
    url: jdbc:mysql://localhost:3307/wooji?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  configuration:
    call-setters-on-nulls: true
    jdbc-type-for-null: NULL

jwt:
  secret: wooji-secret-key-change-me-in-production-2026
  access-validity-ms: 1800000        # 30분
  refresh-validity-ms: 1209600000    # 14일

file:
  upload-dir: C:/workspace/WOOJI/upload

logging:
  level:
    com.wooji: debug
